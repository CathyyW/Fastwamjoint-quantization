[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fastwam-steerquant"
version = "0.1.0"
description = "Action-sensitive calibration and packed INT4 deployment for FastWAMJoint"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "ninja"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fastwam_steerquant = ["kernels/w4a8/csrc/*.cpp", "kernels/w4a8/csrc/*.cu", "kernels/w4a4/csrc/*.cpp", "kernels/w4a4/csrc/*.cu", "kernels/w4a4/csrc/*.cuh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
